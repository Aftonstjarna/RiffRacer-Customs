name: Build and check Customs
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: customs-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install development dependencies
        run: |
          sources="$RUNNER_TEMP/customs-ubuntu.list"
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' > "$sources"
          options=(-o "Dir::Etc::sourcelist=$sources" -o 'Dir::Etc::sourceparts=-' -o APT::Update::Error-Mode=any -o Acquire::Retries=1 -o Acquire::https::Timeout=20)
          sudo apt-get "${options[@]}" update
          sudo apt-get "${options[@]}" install -y g++ pkg-config libgtk-3-dev libpng-dev zlib1g-dev libssl-dev libcurl4-openssl-dev xvfb
      - name: Build and test
        run: |
          make -C LiveryMaker all test
          xvfb-run -a build/livery-maker/reriff-livery-maker --smoke-package build/linux-smoke.png
          xvfb-run -a build/livery-maker/reriff-livery-maker --smoke-update-dialog build/update-dialog.png
          test -s build/update-dialog.png
  anylinux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build AnyLinux AppImage
        run: |
          docker build -t customs-anylinux -f packaging/Containerfile.anylinux .
          docker run --rm -v "$PWD:/src" customs-anylinux
      - name: Test on musl without GTK or FUSE
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache xvfb-run
            xvfb-run -a dist/*.AppImage --smoke-package /src/build/anylinux/alpine-smoke.png
            test -s /src/build/anylinux/alpine-smoke.png
          '
      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-validation
          path: build/anylinux/*smoke.png
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-python
      - name: Build and test native Windows executable
        run: make -C LiveryMaker OUT=../build/windows APP=RiffRacer-Customs EXEEXT=.exe LDFLAGS=-mwindows all test
      - name: Bundle portable Windows application
        run: python scripts/package_windows.py --prefix "$MINGW_PREFIX"
      - name: Test unpacked package without MSYS2 on PATH
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $destination = Join-Path $env:RUNNER_TEMP 'Customs package テスト'
          Expand-Archive "dist/RiffRacer-Customs-$version-windows-x64.zip" $destination
          $package = Join-Path $destination "RiffRacer-Customs-$version-windows-x64"
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:XDG_CONFIG_HOME = Join-Path $env:RUNNER_TEMP 'customs-test-settings'
          $process = Start-Process -FilePath "$package/RiffRacer-Customs.exe" -ArgumentList '--smoke-package', 'build/windows/package-smoke.png' -WorkingDirectory $PWD -Wait -PassThru -RedirectStandardError 'build/windows/package-stderr.txt' -RedirectStandardOutput 'build/windows/package-stdout.txt'
          Get-Content build/windows/package-stdout.txt
          Get-Content build/windows/package-stderr.txt
          if ($process.ExitCode -ne 0) { throw "Package smoke failed: $($process.ExitCode)" }
          if (!(Test-Path build/windows/package-smoke.png)) { throw 'Package screenshot missing' }
          $updates = Start-Process -FilePath "$package/RiffRacer-Customs.exe" -ArgumentList '--smoke-update-dialog', 'build/windows/update-dialog.png' -WorkingDirectory $PWD -Wait -PassThru -RedirectStandardError 'build/windows/update-stderr.txt' -RedirectStandardOutput 'build/windows/update-stdout.txt'
          Get-Content build/windows/update-stdout.txt
          Get-Content build/windows/update-stderr.txt
          if ($updates.ExitCode -ne 0) { throw "Update dialog smoke failed: $($updates.ExitCode)" }
          if (!(Test-Path build/windows/update-dialog.png)) { throw 'Update dialog screenshot missing' }
          if (!(Test-Path "$package/etc/ssl/certs/ca-bundle.crt")) { throw 'TLS certificate bundle missing from package' }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-validation
          path: |
            build/windows/test-livery.exe
            build/windows/package-*.png
            build/windows/package-*.txt
            build/windows/update-*.png
            build/windows/update-*.txt
